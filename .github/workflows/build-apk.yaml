name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Git repository URL"
        required: true
        default: "https://github.com/TON-COMPTE/TON-DEPOT"

      branchName:
        description: "Git branch name [Optional]"
        required: false
        default: ""

      jdkVersion:
        description: "OpenJDK version"
        required: false
        default: "17"

      taskName:
        description: "Gradle task"
        required: false
        default: "assembleRelease"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Installer Java
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ github.event.inputs.jdkVersion }}

      # 2. Télécharger le dépôt privé
      - name: Clone private repository
        env:
          REPO_URL: ${{ github.event.inputs.repository }}
          REPO_TOKEN: ${{ secrets.LEONARKTOKEN }}
        run: |
          if [[ -z "$REPO_TOKEN" ]]; then
            echo "ERROR: LEONARKTOKEN is not configured."
            exit 1
          fi

          AUTH_URL="https://x-access-token:${REPO_TOKEN}@${REPO_URL#https://}"

          if [[ -z "${{ github.event.inputs.branchName }}" ]]; then
            git clone --depth=1 "$AUTH_URL" workspace
          else
            git clone --depth=1 \
              --branch "${{ github.event.inputs.branchName }}" \
              "$AUTH_URL" workspace
          fi

      # 3. Vérifier que le ZIP existe
      - name: Check ZIP
        run: |
          echo "=== Fichiers du dépôt ==="
          find workspace -maxdepth 3 -type f -print

          if [ ! -f "workspace/LEONARK-final-orb.zip" ]; then
            echo "ERROR: LEONARK-final-orb.zip introuvable."
            exit 1
          fi

          echo "ZIP trouvé."

      # 4. Décompresser le projet
      - name: Extract LEONARK-final-orb.zip
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q "workspace/LEONARK-final-orb.zip" -d extracted

          echo "=== Structure extraite ==="
          find extracted -maxdepth 4 -type f \
            \( -name "gradlew" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \) \
            -print

      # 5. Trouver automatiquement le projet Gradle
      - name: Locate Gradle project
        run: |
          PROJECT_DIR=""

          GRADLEW=$(find extracted -type f -name "gradlew" -print -quit)

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR="$(dirname "$GRADLEW")"
          else
            SETTINGS=$(find extracted -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit)

            if [ -n "$SETTINGS" ]; then
              PROJECT_DIR="$(dirname "$SETTINGS")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Aucun projet Gradle Android trouvé."
            echo "Contenu extrait :"
            find extracted -maxdepth 5 -type f -print
            exit 1
          fi

          echo "Projet Gradle trouvé : $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 6. Compiler l'APK
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew absent, création du wrapper..."
            gradle wrapper
          fi

          chmod +x gradlew

          yes | sdkmanager --licenses > /dev/null || true

          echo "=== Compilation ==="
          echo "Projet : $PWD"
          echo "Tâche : ${{ github.event.inputs.taskName }}"

          ./gradlew ${{ github.event.inputs.taskName }} \
            --stacktrace

      # 7. Chercher l'APK
      - name: Find APK
        run: |
          echo "=== APK générés ==="

          find extracted -type f -name "*.apk" -print

          APK_COUNT=$(find extracted -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: Aucun APK généré."
            exit 1
          fi

      # 8. Récupérer l'APK
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: LEONARK-APK
          path: extracted/**/*.apk
          retention-days: 7