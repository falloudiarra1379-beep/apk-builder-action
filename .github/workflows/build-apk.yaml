name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Git repository URL"
        required: true
        default: "https://github.com/TON-COMPTE/TON-DEPOT"

      branchName:
        description: "Git branch name [Optional]"
        required: false
        default: ""

      jdkVersion:
        description: "OpenJDK version"
        required: false
        default: "17"

      taskName:
        description: "Gradle task"
        required: false
        default: "assembleRelease"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ github.event.inputs.jdkVersion }}

      - name: Clone private repository
        env:
          REPO_URL: ${{ github.event.inputs.repository }}
          REPO_TOKEN: ${{ secrets.LEONARKTOKEN }}
        run: |
          if [[ -z "$REPO_TOKEN" ]]; then
            echo "ERROR: LEONARKTOKEN is not configured."
            exit 1
          fi

          AUTH_URL="https://x-access-token:${REPO_TOKEN}@${REPO_URL#https://}"

          if [[ -z "${{ github.event.inputs.branchName }}" ]]; then
            git clone --depth=1 "$AUTH_URL" workspace
          else
            git clone --depth=1 \
              --branch "${{ github.event.inputs.branchName }}" \
              "$AUTH_URL" workspace
          fi

      - name: Check ZIP
        run: |
          echo "=== Contenu du dépôt ==="
          find workspace -maxdepth 3 -type f -print

          if [ ! -f "workspace/LEONARK-final-orb.zip" ]; then
            echo "ERROR: LEONARK-final-orb.zip introuvable."
            exit 1
          fi

          echo "OK : LEONARK-final-orb.zip trouvé."

      - name: Extract LEONARK-final-orb.zip
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q "workspace/LEONARK-final-orb.zip" -d extracted

          echo "=== Projet extrait ==="
          find extracted -maxdepth 5 -type f \
            \( -name "gradlew" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \) \
            -print

      - name: Locate Gradle project
        run: |
          PROJECT_DIR=""

          GRADLEW=$(find extracted -type f -name "gradlew" -print -quit)

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR="$(dirname "$GRADLEW")"
          else
            SETTINGS=$(find extracted -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit)

            if [ -n "$SETTINGS" ]; then
              PROJECT_DIR="$(dirname "$SETTINGS")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Aucun projet Gradle trouvé."
            find extracted -maxdepth 6 -type f -print
            exit 1
          fi

          echo "Projet Gradle trouvé : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify LEONARK project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Vérification du projet ==="
          echo "Répertoire : $PWD"

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew absent."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: dossier app absent."
            exit 1
          fi

          chmod +x gradlew

          echo "=== Fichiers principaux ==="
          ls -la

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew

          echo "======================================"
          echo "      COMPILATION LEONARK RELEASE"
          echo "======================================"

          ./gradlew ${{ github.event.inputs.taskName }} \
            --stacktrace \
            --no-daemon

      - name: Find APK
        run: |
          echo "=== APK générés ==="

          find extracted \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find extracted -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: Aucun APK généré."
            exit 1
          fi

          echo "OK : $APK_COUNT APK trouvé(s)."

      - name: Prepare APK
        run: |
          mkdir -p final-apk

          APK=$(find extracted \
            -type f \
            -name "*.apk" \
            -print -quit)

          echo "APK sélectionné : $APK"

          cp "$APK" "final-apk/LEONARK-release.apk"

          echo "APK final :"
          ls -lh final-apk/LEONARK-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: LEONARK-APK
          path: final-apk/LEONARK-release.apk
          retention-days: 7

      - name: Create corrected ZIP
        run: |
          rm -f LEONARK-final-orb.zip

          PROJECT_PARENT=$(dirname "${PROJECT_DIR}")
          PROJECT_NAME=$(basename "${PROJECT_DIR}")

          cd "$PROJECT_PARENT"

          zip -qr \
            "$GITHUB_WORKSPACE/LEONARK-final-orb.zip" \
            "$PROJECT_NAME"

          cd "$GITHUB_WORKSPACE"

          echo "=== ZIP FINAL ==="
          ls -lh LEONARK-final-orb.zip

          echo "Nom vérifié :"
          basename LEONARK-final-orb.zip

      - name: Upload corrected ZIP
        uses: actions/upload-artifact@v6
        with:
          name: LEONARK-final-orb
          path: LEONARK-final-orb.zip
          retention-days: 7