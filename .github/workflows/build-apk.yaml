# LEONARK — build APK
# À placer dans le dépôt sous : .github/workflows/build-apk.yml
#
# Fonctionne dans les deux cas :
#   1) le dépôt contient LEONARK-final-orb.zip (n'importe où) -> il est extrait puis compilé
#   2) le dépôt contient directement le projet Gradle         -> il est compilé tel quel
#
# Secrets utilisés (aucune valeur n'est écrite dans le code ni affichée dans les logs) :
#   LEONARKTOKEN       (optionnel) jeton d'accès si le ZIP est dans un AUTRE dépôt privé
#   KEYSTORE_BASE64    (optionnel) keystore de signature encodé en base64
#   KEYSTORE_PASSWORD  (optionnel) mot de passe du keystore
#   KEY_ALIAS          (optionnel) alias de la clé
#   KEY_PASSWORD       (optionnel) mot de passe de la clé
# Sans keystore, une clé jetable est générée : l'APK s'installe, mais chaque build
# a une signature différente (désinstaller l'ancienne version avant de mettre à jour).

name: LEONARK - Build APK

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Dépôt contenant le ZIP/projet (owner/repo). Vide = ce dépôt."
        required: false
        default: ""
      source_ref:
        description: "Branche ou tag. Vide = branche par défaut."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: leonark-build-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_API: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ZIP_NAME: "LEONARK-final-orb.zip"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo || github.repository }}
          ref: ${{ inputs.source_ref || '' }}
          token: ${{ secrets.LEONARKTOKEN || github.token }}
          path: repo

      - name: Localiser le projet (extraction du ZIP si présent)
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          ZIP="$(find repo -type f -iname "$ZIP_NAME" -not -path '*/.git/*' | head -n 1 || true)"
          if [ -n "$ZIP" ]; then
            echo "ZIP trouvé : $ZIP"
            mkdir -p extracted
            unzip -q -o "$ZIP" -d extracted
            SEARCH_ROOT="extracted"
          else
            echo "Aucun $ZIP_NAME : le dépôt est utilisé directement."
            SEARCH_ROOT="repo"
          fi

          # Projet Gradle = dossier qui contient gradlew ET settings.gradle(.kts)
          PROJECT_DIR=""
          while IFS= read -r g; do
            d="$(dirname "$g")"
            if [ -f "$d/settings.gradle" ] || [ -f "$d/settings.gradle.kts" ]; then
              PROJECT_DIR="$d"
              break
            fi
          done < <(find "$SEARCH_ROOT" -type f -name gradlew -not -path '*/node_modules/*' | sort)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Aucun projet Gradle (gradlew + settings.gradle) trouvé dans $SEARCH_ROOT"
            exit 1
          fi
          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"
          echo "Projet Gradle : $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          chmod +x "$PROJECT_DIR/gradlew"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_API }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Informations d'environnement
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ./gradlew --version

      - name: Compiler l'APK Debug
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace \
            "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"

      - name: Compiler l'APK Release
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"

      - name: Signer et vérifier l'APK Release
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          OUT_DIR="$GITHUB_WORKSPACE/dist"
          mkdir -p "$OUT_DIR"

          REL_DIR="app/build/outputs/apk/release"
          echo "Contenu de $REL_DIR :"; ls -la "$REL_DIR"

          # APK Release produit par Gradle (non signé si aucun signingConfig n'est défini)
          SRC="$(find "$REL_DIR" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$SRC" ]; then
            echo "::error::Aucun APK Release trouvé dans $REL_DIR"
            exit 1
          fi
          echo "APK Release Gradle : $SRC"

          # Keystore : secrets si présents, sinon clé jetable
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ]; then
            echo "Signature avec le keystore fourni par les secrets."
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            KS_PASS="$KEYSTORE_PASSWORD"
            K_ALIAS="$KEY_ALIAS"
            K_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            echo "::warning::Aucun keystore dans les secrets : clé de signature jetable générée pour ce build."
            KS_PASS="$(openssl rand -hex 16)"
            K_ALIAS="leonark-ci"
            K_PASS="$KS_PASS"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" \
              -alias "$K_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$K_PASS" \
              -dname "CN=LEONARK, O=LEONARK, C=FR" >/dev/null 2>&1
          fi

          # zipalign puis apksigner (ordre imposé pour la signature v2/v3)
          "$BT/zipalign" -f -p 4 "$SRC" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$K_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$K_PASS" \
            --out "$OUT_DIR/LEONARK-release.apk" \
            "$RUNNER_TEMP/aligned.apk"

          # Vérifications : signature valide, fichier non vide, reconnu comme APK Android
          "$BT/apksigner" verify --verbose "$OUT_DIR/LEONARK-release.apk"
          test -s "$OUT_DIR/LEONARK-release.apk"
          "$BT/aapt2" dump badging "$OUT_DIR/LEONARK-release.apk" | head -n 5

          # Copie de l'APK Debug pour test rapide
          DBG="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1 || true)"
          if [ -n "$DBG" ]; then cp "$DBG" "$OUT_DIR/LEONARK-debug.apk"; fi

          ls -la "$OUT_DIR"

          rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/aligned.apk"

      - name: Publier les APK
        uses: actions/upload-artifact@v4
        with:
          name: LEONARK-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publier le rapport de build (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LEONARK-build-reports
          path: |
            ${{ steps.locate.outputs.project_dir }}/app/build/reports/**
            ${{ steps.locate.outputs.project_dir }}/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
